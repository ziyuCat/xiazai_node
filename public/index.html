<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>万能下载器控制台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div class="hero-copy">
          <p class="eyebrow">Universal Downloader Console</p>
          <h1>万能下载器控制台</h1>
          <p class="hero-text">
            用一个页面把分享文案解析、作品详情抓取、下载票据生成这三步跑通。
          </p>
        </div>
        <div class="hero-panel">
          <div class="hero-stat">
            <span class="stat-label">流程</span>
            <span class="stat-value">Parse → Detail → Download</span>
          </div>
          <div class="hero-stat">
            <span class="stat-label">目标</span>
            <span class="stat-value">给小程序提供稳定后端</span>
          </div>
        </div>
      </header>

      <main class="dashboard">
        <section class="panel panel-input">
          <div class="panel-heading">
            <div>
              <p class="panel-kicker">Step 1</p>
              <h2>分享文案解析</h2>
            </div>
            <button id="fill-sample" class="ghost-button" type="button">
              填充示例
            </button>
          </div>

          <label class="field">
            <span class="field-label">抖音分享文案</span>
            <textarea
              id="share-text"
              rows="7"
              placeholder="把抖音里复制出来的完整分享文案贴在这里"
            ></textarea>
          </label>

          <div class="option-row">
            <label class="checkbox">
              <input id="resolve-redirect" type="checkbox" checked />
              <span>展开短链跳转</span>
            </label>
            <label class="checkbox">
              <input id="include-debug" type="checkbox" />
              <span>返回调试信息</span>
            </label>
            <label class="checkbox">
              <input id="fetch-metadata" type="checkbox" checked />
              <span>解析后顺手抓详情</span>
            </label>
          </div>

          <div class="action-row">
            <button id="parse-button" class="primary-button" type="button">
              开始解析
            </button>
            <button id="clear-button" class="ghost-button" type="button">
              清空
            </button>
          </div>

          <p id="status-bar" class="status-bar" aria-live="polite">
            等待输入分享文案。
          </p>
        </section>

        <section class="results-grid">
          <article class="panel">
            <div class="panel-heading">
              <div>
                <p class="panel-kicker">Step 2</p>
                <h2>解析结果</h2>
              </div>
            </div>
            <div id="parse-summary" class="summary-card empty-state">
              还没有解析结果。
            </div>
            <pre id="parse-json" class="json-view empty-state">等待返回...</pre>
          </article>

          <article class="panel">
            <div class="panel-heading">
              <div>
                <p class="panel-kicker">Step 3</p>
                <h2>作品详情</h2>
              </div>
              <button id="refresh-detail" class="ghost-button" type="button">
                单独刷新详情
              </button>
            </div>
            <div id="detail-summary" class="summary-card empty-state">
              解析出作品 ID 后，这里会展示标题、作者、封面和资源列表。
            </div>
            <div id="resource-picker" class="resource-picker hidden">
              <label class="field">
                <span class="field-label">可下载资源</span>
                <select id="resource-select"></select>
              </label>
            </div>
            <pre id="detail-json" class="json-view empty-state">等待返回...</pre>
          </article>
        </section>

        <section class="panel">
          <div class="panel-heading">
            <div>
              <p class="panel-kicker">Step 4</p>
              <h2>下载票据</h2>
            </div>
            <button id="prepare-download" class="primary-button" type="button">
              生成下载地址
            </button>
          </div>

          <div id="download-summary" class="download-card empty-state">
            先完成解析并获取详情，再生成下载票据。
          </div>
          <pre id="download-json" class="json-view empty-state">等待返回...</pre>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
